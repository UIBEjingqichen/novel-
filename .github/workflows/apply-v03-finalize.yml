name: Finalize Qilun v0.3

on:
  push:
    paths:
      - '.github/workflows/apply-v03-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rebuild verified v0.3 index and clean staging
        run: |
          cat .payload/v03/01.b64 .payload/v03/02.b64 .payload/v03/03.b64 .payload/v03/04.b64 .payload/v03/05.b64 .payload/v03/06.b64 | base64 -d > index.html
          echo '04225a71810e5e09901af54a448a1fd481d16dfb18d947618078e8579d3136e4  index.html' | sha256sum -c -
          grep -q '结构沙盘 v0.3' index.html
          grep -q '复合公共服务区' index.html
          grep -q '生活组团径向伸缩' index.html
          git rm -r .payload
          git rm -f .github/workflows/apply-v03.yml .github/workflows/apply-v03-fixed.yml .github/workflows/apply-v03-finalize.yml v03-ready.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: rebuild Qilun model around composite urban segments"
          git push
