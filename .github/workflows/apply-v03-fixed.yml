name: Apply Qilun v0.3 patch fixed

on:
  push:
    paths:
      - '.github/workflows/apply-v03-fixed.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Decode existing patch payload and apply
        run: |
          sed -n '/PATCH_B64: >-/,/        run: |/p' .github/workflows/apply-v03.yml | sed '1d;$d' | tr -d '[:space:]' | base64 -d | gzip -d > /tmp/qilun-v03.patch
          git apply /tmp/qilun-v03.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: correct Qilun spatial proportions and service movement"
          git push
